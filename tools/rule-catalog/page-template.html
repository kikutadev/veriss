<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>veriss 検査ルール一覧 — kikutadev fork</title>
<meta name="description" content="veriss フォークのCSS・DOM静的検査一覧。13分類の検査範囲、NG/OK例、TypeScript移行・Lean研究の追加点。">
<link rel="canonical" href="https://kikutadev.github.io/veriss/">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: left rail of the 13 roles beside a reading column; tables scroll inside their own frame. */
:root{
  --bg:#f7f8fa; --surface:#ffffff; --fg:#17202b; --muted:#5a6675; --line:#dde2e9; --accent:#1f5fd6; --code-bg:#eef1f6;
  --ok:#1a7f4b; --ok-bg:#e3f4ea; --part:#8a5a00; --part-bg:#fff1cc; --unk:#4b5563; --unk-bg:#e8eaee;
  --spec:#2457a6; --spec-bg:#e2ecfb; --diff:#7a3fb0; --diff-bg:#f1e6fb;
  --sans:"IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#151c25; --fg:#e4e9f0; --muted:#9aa6b5; --line:#2a3441; --accent:#7aa7ff; --code-bg:#1d2632;
  --ok:#6fd39c; --ok-bg:#17352a; --part:#f0c463; --part-bg:#3a2f12; --unk:#c2c8d0; --unk-bg:#2a313b;
  --spec:#8fb6ff; --spec-bg:#1b2c48; --diff:#cfa3f5; --diff-bg:#2f2240; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#151c25; --fg:#e4e9f0; --muted:#9aa6b5; --line:#2a3441; --accent:#7aa7ff; --code-bg:#1d2632;
  --ok:#6fd39c; --ok-bg:#17352a; --part:#f0c463; --part-bg:#3a2f12; --unk:#c2c8d0; --unk-bg:#2a313b;
  --spec:#8fb6ff; --spec-bg:#1b2c48; --diff:#cfa3f5; --diff-bg:#2f2240; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.75 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;padding-block:40px 80px}
header{grid-column:1/-1;display:grid;gap:12px}
.topline{display:flex;align-items:baseline;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
.topline .links{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
header .eyebrow{font:600 12px var(--mono);letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
h1 .fork{display:inline-block;font:600 12px var(--mono);letter-spacing:.07em;vertical-align:middle;background:var(--code-bg);border-radius:4px;padding:2px 7px;color:var(--muted);margin-left:9px}
h1{font-size:clamp(26px,4vw,36px);line-height:1.3;margin:0;text-wrap:balance}
header p{margin:0;max-width:70ch;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:4px;font-size:13px;color:var(--muted)}
.legend span.cnt{font:600 12px var(--mono);margin-left:4px;font-variant-numeric:tabular-nums}
.fork-note{border-left:3px solid var(--accent);padding-left:12px;font-size:13px;color:var(--muted)}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.tools input{font:14px var(--mono);padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);width:min(360px,100%)}
.tools input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tools .hits{font-size:13px;color:var(--muted)}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start;display:grid;gap:2px;font-size:13px;line-height:1.5}
nav a{color:var(--muted);text-decoration:none;padding:5px 10px;border-left:2px solid var(--line)}
nav a:hover,nav a:focus-visible{color:var(--fg);border-left-color:var(--accent);outline:none}
main{min-width:0}
section{padding-top:8px;margin-bottom:48px;scroll-margin-top:16px}
h2{font-size:21px;line-height:1.4;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);text-wrap:balance}
p,ul{max-width:72ch;margin:0 0 12px}
ul{padding-left:1.2em}
a{color:var(--accent)}
code{font:0.86em var(--mono);background:var(--code-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
figure{margin:16px 0 20px}
figure img{display:block;width:100%;max-width:900px;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:12px 0 20px}
table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.6}
table.wide{min-width:980px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;background:var(--code-bg);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td:first-child code{white-space:normal}
tr[hidden]{display:none}
.v{display:inline-block;font-size:12px;font-weight:600;padding:0 8px;border-radius:999px;white-space:nowrap;margin-right:6px}
.v-ok{color:var(--ok);background:var(--ok-bg)} .v-part{color:var(--part);background:var(--part-bg)} .v-unk{color:var(--unk);background:var(--unk-bg)}
.v-spec{color:var(--spec);background:var(--spec-bg)} .v-diff{color:var(--diff);background:var(--diff-bg)}
.vnote{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:24px 60px}nav{position:static;display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-block:4px 12px}nav a{white-space:nowrap;flex:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px}h1 .fork{margin:0 0 0 4px}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="topline"><div class="eyebrow">kikutadev / veriss · static CSS × DOM</div><div class="links"><a href="https://github.com/kikutadev/veriss">フォークのコード</a><a href="https://mizchi.github.io/veriss/">元のカタログ</a></div></div>
  <h1>veriss 検査ルール一覧 <span class="fork">FORK EDITION</span></h1>
  <p>約420の検査コードを13の役割に整理し、検査できる条件とUnknownになる境界を説明する。元のカタログのNG/OK実例を引き継ぎ、フォークで加えたTypeScript実装とLeanの独立検算（研究段階）を区別して掲載。</p>
  <p class="fork-note">フォーク独自の変更点と、形式的に証明できる範囲の境界は<a href="#フォークで追加統合したこと">こちら</a>。上流の新規ルールF116〜F133も取り込み済み。</p>
  <div class="legend" id="legend"></div>
  <div class="tools"><label for="q" class="hits">コードや語で絞り込む</label><input id="q" type="search" placeholder="例: CONTRAST、表、Unknown" autocomplete="off"><span class="hits" id="hits"></span></div>
</header>
<nav aria-label="役割"><!--NAV--></nav>
<main><!--BODY--></main>
</div>
<script>
(() => {
  const kinds = [['ok','検査可'],['part','一部'],['spec','仕様のみ'],['diff','差を報告'],['unk','Unknown / 拒否']];
  document.getElementById('legend').innerHTML = kinds.map(([k, w]) => `<span><span class="v v-${k}">${w}</span><span class="cnt">${document.querySelectorAll('main .v-' + k).length} 行</span></span>`).join('');
  const q = document.getElementById('q'), hits = document.getElementById('hits');
  const rows = [...document.querySelectorAll('main tbody tr')];
  const apply = () => {
    const t = q.value.trim().toLowerCase(); let n = 0;
    for (const r of rows) { const on = !t || r.textContent.toLowerCase().includes(t); r.hidden = !on; if (on) n++; }
    hits.textContent = t ? `${n} 行` : '';
  };
  q.addEventListener('input', apply);
})();
</script>

</body>
</html>
